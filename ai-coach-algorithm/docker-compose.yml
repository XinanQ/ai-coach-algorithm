services:
  redis:
    image: redis:7-alpine
    container_name: ai-coach-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: ai-coach-postgres
    environment:
      POSTGRES_DB: ai_coach
      POSTGRES_USER: ai_coach
      POSTGRES_PASSWORD: ai_coach_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:

