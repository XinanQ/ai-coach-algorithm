spring.application.name=StageOneCode

spring.datasource.url=jdbc:mysql://localhost:3306/stage_one?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:'YourMySQPassword'}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.report-dir=uploads/reports

ai.coach.base-url=http://127.0.0.1:8000
ai.coach.default-total-rounds=3
ai.coach.data-dir=../ai-coach-algorithm
